[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "langchain-geniffy"
version = "0.2.0"
description = "Geniffy for LangChain: a memory of each of your users, for any LangChain agent. Middleware, tools and a retriever."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Geniffy", email = "ops@geniffy.com" }]
keywords = ["langchain", "memory", "agents", "middleware", "retriever", "geniffy"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]
dependencies = ["langchain>=1.0,<2", "geniffy>=0.4.0", "typing-extensions>=4.7"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://geniffy.com"
Documentation = "https://docs.geniffy.com/integrations/langchain"
Repository = "https://github.com/Geniffy/langchain-geniffy"
Issues = "https://github.com/Geniffy/langchain-geniffy/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_geniffy"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
